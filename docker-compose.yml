version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: samvahak
      POSTGRES_PASSWORD: samvahak
      POSTGRES_DB: samvahak
    ports:
      - "5432:5432"
    volumes:
      - samvahak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samvahak"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://samvahak:samvahak@db:5432/samvahak
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  samvahak_pgdata:
